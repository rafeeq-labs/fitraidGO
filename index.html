<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141c30" />
  <title>RaidFit</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141c30; }
    #app { position: fixed; inset: 0; touch-action: none; }
    #app canvas { display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Segoe UI', system-ui, sans-serif; }
    #stats {
      position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px;
      color: #cfe3ff; background: rgba(20, 28, 48, 0.72); border: 1px solid rgba(77, 184, 255, 0.35);
      border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.45;
      white-space: pre-wrap; max-width: calc(100vw - 32px); display: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "earcut": "/vendor/earcut/earcut.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud"><div id="stats"></div></div>
  <script type="module" src="/dist/js/main.js"></script>
</body>
</html>
